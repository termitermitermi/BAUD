<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="dyschan-api-base-url" content="https://dyschan-api.dyschan.workers.dev">
<title>DYSCHAN Thread</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body data-page="thread">
<header>
  <nav class="breadcrumb">
    <a href="index.html">Home</a>
    <span class="sep">›</span>
    <a id="board-link" href="board.html">Board</a>
    <span class="sep">›</span>
    <span id="thread-title">Thread</span>
  </nav>
</header>
<main>
  <div id="thread-content"></div>
  <section id="reply-section">
    <h2>Reply</h2>
    <form id="reply-form">
      <input type="text" id="user-secret" placeholder="Your secret (optional, for identity)" autocomplete="off">
      <textarea id="reply-body" placeholder="Your reply..." rows="4" required></textarea>
      <button type="submit">Post Reply</button>
    </form>
    <p id="reply-status"></p>
  </section>

  <!-- Flag/Report Modal -->
  <div id="flag-modal" class="modal hidden">
    <div class="modal-content">
      <button type="button" class="close-modal" aria-label="Close report dialog">&times;</button>
      <h3>Report Post</h3>
      <input type="hidden" id="flag-board-id" value="">
      <input type="hidden" id="flag-thread-id" value="">
      <input type="hidden" id="flag-post-id" value="">
      <div class="flag-reasons">
        <label class="flag-reason"><input type="radio" name="flag-reason" value="spam"> Spam</label>
        <label class="flag-reason"><input type="radio" name="flag-reason" value="abuse"> Abuse</label>
        <label class="flag-reason"><input type="radio" name="flag-reason" value="illegal"> Illegal</label>
        <label class="flag-reason"><input type="radio" name="flag-reason" value="other"> Other</label>
      </div>
      <textarea id="flag-details" placeholder="Additional details (optional)" rows="3"></textarea>
      <button type="button" class="flag-submit-btn">Submit Report</button>
      <p id="flag-status" class="status-text"></p>
    </div>
  </div>
</main>
<footer id="version-footer" class="site-footer">Loading version info...</footer>
<script src="dist/crypto.js"></script>
<script src="dist/pow.js"></script>
<script src="dist/style.js"></script>
<!-- DYSCHAN_CLIENT_CONFIG_INJECTION -->
<script>
  window.DYSCHAN_CLIENT_CONFIG = Object.assign(window.DYSCHAN_CLIENT_CONFIG || {}, {
    API_BASE_URL: "https://dyschan-api.dyschan.workers.dev/api",
    JOIN_ENDPOINT: "https://dyschan-api.dyschan.workers.dev/api/join",
    THREAD_ENDPOINT: "https://dyschan-api.dyschan.workers.dev/api/thread",
    POST_ENDPOINT: "https://dyschan-api.dyschan.workers.dev/api/post",
    BOARD_ENDPOINT: "https://dyschan-api.dyschan.workers.dev/api/board",
    GET_THREAD_ENDPOINT: "https://dyschan-api.dyschan.workers.dev/api/get-thread"
  });
</script>
<script src="dist/clientConfig.js"></script>
<script src="dist/app.js"></script>
</body>
</html>
