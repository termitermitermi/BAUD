<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="dyschan-api-base-url" content="https://dyschan-api.dyschan.workers.dev">
<title>DYSCHAN Board</title>
<link rel="stylesheet" href="css/main.css">
</head>
<body data-page="board">
<header>
  <nav class="breadcrumb">
    <a href="index.html">Home</a>
    <span class="sep">›</span>
    <span id="board-name-header">Board</span>
  </nav>
</header>
<main>
  <div id="board-info" class="board-info hidden"></div>
  <div id="board-actions">
    <button id="new-thread-btn">New Thread</button>
  </div>
  <div id="new-thread-form" class="hidden">
    <h2>New Thread</h2>
    <form id="thread-form">
      <input type="text" id="user-secret" placeholder="Your secret (optional, for identity)" autocomplete="off">
      <div id="chanid-field" class="hidden">
        <input type="text" id="chanid" placeholder="Chan ID (identity name)" autocomplete="off" maxlength="128">
      </div>
      <div id="quiet-field" class="hidden">
        <label class="checkbox-label">
          <input type="checkbox" id="quiet-post">
          <span>Quiet post (don't bump thread)</span>
        </label>
        <span id="quiet-note" class="field-note hidden"></span>
      </div>
      <textarea id="thread-body" placeholder="Thread body..." rows="5" required></textarea>
      <button type="submit">Post Thread</button>
    </form>
    <p id="thread-status"></p>
  </div>
  <div id="board-content"></div>
</main>
<footer id="version-footer" class="site-footer">Loading version info...</footer>
<script src="dist/crypto.js"></script>
<script src="dist/pow.js"></script>
<script src="dist/style.js"></script>
<!-- DYSCHAN_CLIENT_CONFIG_INJECTION -->
<script>
  window.DYSCHAN_CLIENT_CONFIG = Object.assign(window.DYSCHAN_CLIENT_CONFIG || {}, {
    API_BASE_URL: "https://dyschan-api.dyschan.workers.dev/api",
    JOIN_ENDPOINT: "https://dyschan-api.dyschan.workers.dev/api/join",
    THREAD_ENDPOINT: "https://dyschan-api.dyschan.workers.dev/api/thread",
    POST_ENDPOINT: "https://dyschan-api.dyschan.workers.dev/api/post",
    BOARD_ENDPOINT: "https://dyschan-api.dyschan.workers.dev/api/board",
    GET_THREAD_ENDPOINT: "https://dyschan-api.dyschan.workers.dev/api/get-thread",
    FLAG_ENDPOINT: "https://dyschan-api.dyschan.workers.dev/api/flag"
  });
</script>
<script src="dist/clientConfig.js"></script>
<script src="dist/app.js"></script>
</body>
</html>
